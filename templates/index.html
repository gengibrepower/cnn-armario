<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Armário Virtual | Acesso</title>
    <link rel="stylesheet" href="style.css">
        
</head>
<body>

<div class="container">
    <h1>Armário Inteligente</h1>
    <p style="color: var(--color-contrast-dark);">Acesse suas peças ou crie sua conta.</p>
    
    <div class="message error" id="alert-message"></div>

    <h2>Login de Usuário</h2>
    <form id="login-form">
        <input type="text" name="identificador" id="identificador" placeholder="Seu Nome ou ID" required><br>
        <input type="password" name="senha" id="login_password" placeholder="Sua Senha" required><br>
        <button type="submit">Entrar</button>
    </form>
    
    <hr>
    
    <h2>Novo por aqui?</h2>
    <form id="register-form">
        <input type="text" name="nome" id="new_username" placeholder="Novo Nome de Usuário" required><br>
        <input type="password" name="senha" id="new_password" placeholder="Crie uma Senha Forte" required><br>
        <button type="submit">Criar Conta</button>
    </form>
</div>

<script>
    const API_BASE = ""; 

    function showAlert(message, type = 'error') {
        const alertDiv = document.getElementById('alert-message');
        alertDiv.textContent = message;
        alertDiv.className = `message ${type}`;
        alertDiv.style.display = 'block';
        setTimeout(() => { alertDiv.style.display = 'none'; }, 5000);
    }

    // --- Lógica de Login ---
    document.getElementById("login-form").addEventListener("submit", async function(event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);
        
        try {
            const response = await fetch(`${API_BASE}/login`, {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                window.location.href = `${API_BASE}/armario`; 
            } else {
                showAlert("Falha no Login: " + (data.erro || 'Erro de rede.'));
            }
        } catch (error) {
            showAlert("Erro de rede ao tentar logar.");
            console.error(error);
        }
    });

    // --- Lógica de Registro ---
    document.getElementById("register-form").addEventListener("submit", async function(event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);
        
        try {
            const response = await fetch(`${API_BASE}/register`, {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                showAlert(`Usuário '${data.nome}' registrado com sucesso! Faça login abaixo.`, 'success');
                form.reset(); 
            } else {
                showAlert("Erro ao registrar: " + (data.erro || 'Resposta inválida da API'), 'error');
            }
        } catch (error) {
            showAlert("Erro de rede ao tentar registrar.", 'error');
            console.error(error);
        }
    });
</script>

</body>
</html>
