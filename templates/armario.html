<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Armário | Armário Virtual</title> 
    <link rel="stylesheet" href="armario.css">
</head>
<body>

<div class="container">
    <button class="logout-btn" onclick="logout()">Sair ({{ username }})</button>

    <h1>Armário Virtual</h1>
    <p style="text-align: center; margin-top: -10px;">Bem-vindo, <b>{{ username }}</b>!</p> 
    
    <div class="message" id="alert-message" style="display: none;"></div>

    <h2>Estatísticas Rápidas do Armário</h2>
    <div id="count-sector">
        <p>Carregando contagens...</p>
    </div>
    
    <hr>
    
    <h2>Inspiração de Look ✨</h2>
    <div style="text-align: center; margin-bottom: 20px;">
        <button id="generate-outfit-btn" onclick="generateOutfit()">Gerar um Outfit Aleatório</button>
    </div>

    <div id="outfit-display">
        <p>Clique em "Gerar um Outfit Aleatório" para ver a sugestão.</p>
    </div>

    <hr> 
    
    <h2>Adicionar Nova Peça</h2>
    <form id="upload-form" enctype="multipart/form-data">
        <div class="form-group">
            <label for="image">Selecione a Imagem da Roupa:</label>
            <input type="file" name="file" id="image" accept="image/*" required>
        </div>
        <button type="submit" style="width: 100%;">Enviar e Classificar</button>
    </form>

    <div class="preview">
        <img id="preview-img" src="#">
    </div>

    <hr>

    <h2>Suas Roupas</h2>
    <div class="form-group" style="margin-top: 15px; display: flex; gap: 10px; align-items: flex-end;">
        <div style="flex-basis: 45%;">
            <label for="filter_category_select">Filtrar por Categoria Exata:</label>
            <select id="filter_category_select" onchange="carregarArmario()">
                <option value="">Mostrar Todas as Roupas</option>
            </select>
        </div>
        <div style="flex-basis: 45%;">
            <label for="filter_category_text">Ou Buscar por Termo (Parcial):</label>
            <input type="text" id="filter_category_text" placeholder="Ex: Calça, Top" onkeyup="carregarArmario()">
        </div>
        <div style="flex-basis: 10%;">
            <button onclick="carregarArmario()" style="width: 100%;">Filtrar</button>
        </div>
    </div>

    <div id="armario"></div>

</div>

<script>
    const API_BASE = ""; 
    
    // Categorias que acionam o pedido de nova foto (o usuário quer que isso funcione)
    const REUPLOAD_CATEGORIES = ["Skip", "Not sure", "Other"];
    // Categorias que não são úteis (escondidas de filtros/contagens)
    const HIDDEN_CATEGORIES = ["Body", ...REUPLOAD_CATEGORIES]; 

    function showAlert(message, type = 'success') {
        const alertDiv = document.getElementById('alert-message');
        alertDiv.textContent = message;
        alertDiv.className = `message ${type}`;
        alertDiv.style.display = 'block';
        setTimeout(() => { alertDiv.style.display = 'none'; }, 8000); 
    }
    
    // --- Lógica de Logout ---
    async function logout() {
        const response = await fetch(`${API_BASE}/logout`, { method: "POST" });
        if (response.ok) {
            window.location.href = `${API_BASE}/`;
        } else {
            alert("Erro ao deslogar.");
        }
    }
    window.logout = logout;

    // --- Lógica de Carregamento de Categorias (Dropdown) ---
    async function loadCategories() {
        const select = document.getElementById("filter_category_select");
        const response = await fetch(`${API_BASE}/items/categories`);
        
        while (select.options.length > 1) { select.remove(1); }
        
        if (response.ok) {
            const categories = await response.json();
            categories.forEach(cat => {
                if (!HIDDEN_CATEGORIES.includes(cat)) { 
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    select.appendChild(option);
                }
            });
        }
    }
    window.loadCategories = loadCategories;


    // --- Lógica de Contagem de Peças ---
    async function loadItemCounts() {
        const countSector = document.getElementById("count-sector");
        countSector.innerHTML = "<p>Atualizando...</p>";

        const response = await fetch(`${API_BASE}/items/count`);
        
        if (!response.ok) {
            countSector.innerHTML = "<p>Não foi possível carregar as estatísticas.</p>";
            return;
        }

        const counts = await response.json();
        let html = '';
        let total = 0;

        for (const cat in counts) {
            if (!REUPLOAD_CATEGORIES.includes(cat)) { 
                html += `
                    <div class="count-item">
                        <div class="count-value">${counts[cat]}</div>
                        <div class="count-label">${cat}</div>
                    </div>
                `;
                total += counts[cat];
            }
        }
        
        if (total > 0) {
            html += `
                <div class="count-item total">
                    <div class="count-value">${total}</div>
                    <div class="count-label">TOTAL</div>
                </div>
            `;
            countSector.innerHTML = html;
        } else {
            countSector.innerHTML = "<p>Seu armário está vazio. Comece a enviar suas roupas!</p>";
        }
    }
    window.loadItemCounts = loadItemCounts;


    // --- Lógica de Geração de Look (NOVO) ---
    async function generateOutfit() {
        const display = document.getElementById("outfit-display");
        const button = document.getElementById("generate-outfit-btn");
        
        display.innerHTML = '<p>Montando o look, aguarde...</p>';
        button.disabled = true;

        try {
            const response = await fetch(`${API_BASE}/outfit/generate`);
            const data = await response.json();

            if (response.ok) {
                const outfit = data.outfit;
                let html = '';

                // Mapeia as zonas para exibição visual
                const zone_names = {
                    "parte_cima": "Cima",
                    "cobertura": "Cobertura",
                    "parte_baixo": "Baixo",
                    "calcado": "Calçado"
                };

                for (const zone in outfit) {
                    const item = outfit[zone];
                    const zone_label = zone_names[zone] || zone;

                    html += `
                        <div class="item" style="width: 150px; flex-shrink: 0; box-shadow: 0 0 10px rgba(0,0,0,0.15);">
                            <p style="margin: 0; font-size: 0.9em; color: var(--color-contrast-dark); font-weight: 500;">
                                ${zone_label}
                            </p>
                            <img src="${item.image_url}" alt="${item.categoria}" style="height: 100px;">
                            <p class="item-cat" style="margin-top: 5px;">${item.categoria}</p>
                        </div>
                    `;
                }
                display.innerHTML = html;
                showAlert("Look sugerido gerado com sucesso!", 'success');

            } else {
                display.innerHTML = `<p style="color: #cc0000;">${data.erro || 'Erro ao montar o look.'}</p>`;
                showAlert(data.erro || "Não foi possível gerar um look completo. Verifique se você tem peças suficientes!", 'error');
            }

        } catch (error) {
            display.innerHTML = `<p style="color: #cc0000;">Erro de rede ao tentar gerar o look.</p>`;
            console.error(error);
        } finally {
            button.disabled = false;
        }
    }
    window.generateOutfit = generateOutfit;


    // --- Lógica de Upload ---
    document.getElementById("image").addEventListener("change", function(event) {
        let img = document.getElementById("preview-img");
        if (event.target.files.length > 0) {
            img.src = URL.createObjectURL(event.target.files[0]);
            img.style.display = "block";
        }
    });

    document.getElementById("upload-form").addEventListener("submit", async function(event) {
        event.preventDefault();
        
        let formData = new FormData(event.target);
        
        const fileInput = document.getElementById("image");
        if (fileInput.files.length === 0) {
             showAlert("Selecione um arquivo de imagem.", 'error');
             return;
        }

        const upload_url = `${API_BASE}/upload-item`;

        try {
            const response = await fetch(upload_url, {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                const categoria = data.categoria;
                
                // Lógica de "Nova Foto"
                if (REUPLOAD_CATEGORIES.includes(categoria)) {
                    showAlert(`A classificação foi '${categoria}'. Por favor, **reenvie a foto** com um novo ângulo ou iluminação para uma melhor classificação.`, 'warning');
                } else {
                    showAlert(`Classificação: ${categoria}. Roupa salva com sucesso!`, 'success');
                }

                loadCategories();
                loadItemCounts();
                carregarArmario();
                // Limpa o preview e o input
                document.getElementById("preview-img").style.display = 'none';
                document.getElementById("image").value = '';

            } else {
                showAlert("Erro no upload: " + (data.erro || 'Verifique o console para detalhes.'), 'error');
            }
        } catch (error) {
            showAlert("Erro de rede ao tentar fazer upload.", 'error');
            console.error(error);
        }
    });

    // --- Lógica de Deleção ---
    async function deletarItem(itemId) {
        if (!confirm(`Tem certeza que deseja deletar o item ID ${itemId}?`)) {
            return;
        }
        
        const delete_url = `${API_BASE}/items/${itemId}`; 

        try {
            const response = await fetch(delete_url, {
                method: "DELETE"
            });

            const data = await response.json();

            if (response.ok) {
                showAlert(`Item ID ${itemId} deletado com sucesso.`, 'success');
                loadCategories(); 
                loadItemCounts();
                carregarArmario();
            } else {
                showAlert("Erro ao deletar: " + (data.erro || 'Verifique o console para detalhes.'), 'error');
            }
        } catch (error) {
            showAlert("Erro de rede ao tentar deletar.", 'error');
            console.error(error);
        }
    }
    window.deletarItem = deletarItem;


    // --- Lógica de Carregamento/Filtro do Armário ---
    async function carregarArmario() {
        let filter_category_select = document.getElementById("filter_category_select").value.trim();
        let filter_category_text = document.getElementById("filter_category_text").value.trim();
        
        let final_filter = filter_category_text || filter_category_select;

        let list_url = `${API_BASE}/items`;

        if (final_filter) {
            list_url += `?categoria=${encodeURIComponent(final_filter)}`; 
        }

        const response = await fetch(list_url);
        const div = document.getElementById("armario");
        div.innerHTML = "";
        
        if (!response.ok) {
             div.innerHTML = "<p>Sua sessão expirou. <a href='/'>Faça login novamente.</a></p>";
             return;
        }

        const items = await response.json();
        
        // Filtra os itens recebidos para esconder categorias indesejadas
        const display_items = items.filter(item => 
            !REUPLOAD_CATEGORIES.includes(item.categoria)
        );
        
        if (display_items.length === 0) {
            div.innerHTML = "<p>Armário vazio ou nenhum item corresponde ao filtro.</p>";
            return;
        }

        display_items.forEach(item => {
            div.innerHTML += `
                <div class="item">
                    <img src="${item.image_url}" alt="Roupa ${item.categoria}">
                    <p class="item-cat">${item.categoria}</p>
                    <small style="font-size: 0.7em;">ID: ${item.id}</small><br>
                    <button class="delete-btn" onclick="deletarItem(${item.id})">Deletar</button>
                </div>
            `;
        });
    }

    // Carrega tudo automaticamente ao entrar na páginaaaa
    document.addEventListener("DOMContentLoaded", () => {
        loadCategories();
        loadItemCounts();
        carregarArmario();
    });
</script>

</body>
</html>
